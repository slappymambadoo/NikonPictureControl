<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Picture Control Comparison</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="bar">
    <h1>Picture Control Comparison</h1>
    <p class="count" id="count"></p>
  </div>
  <nav id="tabs" aria-label="Scenes"></nav>
</header>

<main id="grid" aria-label="Presets"></main>

<div id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Preset viewer">
  <button id="lb-close" aria-label="Close">×</button>
  <button id="lb-prev" aria-label="Previous preset">‹</button>
  <button id="lb-next" aria-label="Next preset">›</button>
  <figure>
    <img id="lb-img" alt="">
    <figcaption id="lb-caption"></figcaption>
  </figure>
  <div id="lb-strip"></div>
</div>

<script src="app.js"></script>
</body>
</html>
